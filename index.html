<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#122b2c"><meta name="description" content="An interactive BMW digital cockpit, recreated from the supplied Figma design.">
<title>BMW — Digital Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anta&family=Bruno+Ace+SC&family=Inter:wght@400;500&family=Orbitron:wght@400;600;700&family=Poppins:wght@400;500&family=Sarpanch:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"><video class="background-video" autoplay muted loop playsinline preload="auto" poster="assets/background.png"><source src="assets/background.mp4" type="video/mp4"></video></div>
<div class="cockpit">
<header class="header">
<button class="brand glass" aria-label="BMW home" data-action="home"><img src="assets/logo.png" alt="BMW" width="150" height="150"></button>
<nav class="topnav" aria-label="Main navigation">
<button class="glass" data-panel="garage">Garage</button><button class="glass selected" data-action="features" aria-current="page">Features</button><button class="glass" data-panel="about">About</button><button class="glass" data-panel="shop">Shop</button>
</nav>
<button class="profile" data-panel="profile" aria-label="Open George Best's profile"><span><small>WELCOME BACK</small><strong>GEORGE BEST</strong></span><img src="assets/avatar.png" alt="" width="50" height="50"></button>
</header>
<main class="main">
<section class="hero" aria-labelledby="headline">
<h1 id="headline">Bayerische Motoren Werke</h1>
<p class="intro">We embrace the road with precision, power, and purpose—BMW redefines how we drive, how<br class="desktop-break"> we live, and how we express ourselves.</p>
<div class="feature-tabs" role="tablist" aria-label="Explore BMW">
<button class="glass" id="performance-tab" role="tab" aria-selected="false" aria-controls="feature-description" tabindex="-1" data-tab="performance">Performance</button>
<button class="glass selected" id="features-tab" role="tab" aria-selected="true" aria-controls="feature-description" data-tab="features">Features</button>
<button class="glass" id="design-tab" role="tab" aria-selected="false" aria-controls="feature-description" tabindex="-1" data-tab="design">Design</button>
</div>
<div id="feature-description" class="feature-description" role="tabpanel" aria-labelledby="features-tab" tabindex="0" hidden></div>
<div class="location"><p><span class="location-dot">•</span> Location <strong>Munich, Germany</strong></p><img class="location-line" src="assets/locationLine.svg" alt=""><img class="globe" src="assets/globe.png" alt="Globe showing Munich, Germany" width="170" height="170"><img class="globe-line" src="assets/globeLine.svg" alt=""></div>
</section>
<aside class="widgets" aria-label="Vehicle overview">
<button class="widget glass customization" data-panel="customization"><span class="widget-title">Customization</span><img class="power" src="assets/power.svg" alt=""><img class="car" src="assets/car.png" alt="BMW front view" width="150" height="150"></button>
<button class="widget glass range" data-panel="range"><span class="widget-title">Range</span><img class="power" src="assets/power.svg" alt=""><span class="range-meter"><img src="assets/range.svg" alt=""><span>635<br>KM</span></span></button>
</aside>
</main>
<footer class="footer"><div class="dock-curve" aria-hidden="true"><img src="assets/dockLine.svg" alt=""></div>
<nav class="dock" aria-label="Cockpit controls">
<button data-action="home" aria-label="Home"><img src="assets/home.svg" alt=""></button>
<button data-panel="music" aria-label="Music"><img src="assets/music.svg" alt=""></button>
<button class="active" data-action="vehicle" aria-label="Vehicle" aria-current="page"><img src="assets/vehicle.svg" alt=""></button>
<button data-panel="apps" aria-label="Apps"><img src="assets/apps.svg" alt=""></button>
<button data-panel="settings" aria-label="Settings"><img src="assets/settings.svg" alt=""></button>
<button data-panel="profile" aria-label="Profile"><img src="assets/user.svg" alt=""></button>
</nav></footer>
</div>
<dialog id="panel" aria-labelledby="panel-title"><div class="dialog-top"><p class="eyebrow">BMW DIGITAL COCKPIT</p><button class="close" aria-label="Close dialog">×</button></div><h2 id="panel-title"></h2><div id="panel-content"></div></dialog>
<div class="toast" role="status" aria-live="polite"></div>
</body></html>
